apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-provider
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aleksandar-kinanov/onboarding.git
    targetRevision: main
    path: apps/keycloak-provider
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
