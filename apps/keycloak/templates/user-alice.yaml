apiVersion: user.keycloak.crossplane.io/v1alpha1
kind: User
metadata:
  name: onboarding-alice
spec:
  forProvider:
    realmIdRef:
      name: onboarding
    username: alice
    email: alice@example.com
    emailVerified: true
    enabled: true
    firstName: Alice
    lastName: Example
    initialPassword:
      - temporary: false
        valueSecretRef:
          name: onboarding-user-passwords
          namespace: keycloak
          key: alice
  providerConfigRef:
    name: keycloak-provider-config
---
apiVersion: user.keycloak.crossplane.io/v1alpha1
kind: Roles
metadata:
  name: onboarding-alice-roles
spec:
  forProvider:
    realmIdRef:
      name: onboarding
    userIdRef:
      name: onboarding-alice
    roleIdsRefs:
      - name: onboarding-app-admin
  providerConfigRef:
    name: keycloak-provider-config
