apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-kafka-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-kafka-test
  template:
    metadata:
      labels:
        app: python-kafka-test
    spec:
      containers:
        - name: python-kafka-test
          image: ghcr.io/aleksandar-kinanov/onboarding/python-kafka-test:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: python-kafka-test-config
          env:
            # Strimzi's generated Secret uses a bare "password" key (not
            # KAFKA_PASSWORD), so it can't be bulk-imported via envFrom
            # without breaking main.py's expected env var name.
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: python-kafka-test-user
                  key: password
