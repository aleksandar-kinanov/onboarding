apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: python-kafka-test-user
  labels:
    strimzi.io/cluster: my-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: python-kafka-test
          patternType: literal
        operations:
          - Create
          - Describe
          - Read
          - Write
        host: "*"
      - resource:
          type: group
          name: my-group
          patternType: literal
        operations:
          - Read
        host: "*"
