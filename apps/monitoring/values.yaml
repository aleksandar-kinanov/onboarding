grafana:
  adminUser: admin
  adminPassword: admin  # local sandbox placeholder, not a real credential

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://monitoring-loki-gateway.monitoring.svc.cluster.local
          isDefault: true

loki:
  loki:
    auth_enabled: false  # single-tenant local sandbox, no X-Scope-OrgID needed
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    rulerConfig:
      enable_api: true

  ignoreMinioDeprecation: true  # Temporary workaround – MinIO will be removed 2026-10-31
  minio:
    enabled: true
        
  deploymentMode: Monolithic

  singleBinary:
    replicas: 1

  # Zero out replica counts of other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0