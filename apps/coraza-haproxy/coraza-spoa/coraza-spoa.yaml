bind: 0.0.0.0:9000

log_level: info
log_file: /dev/stdout
log_format: console

default_application: sample_app

applications:
  - name: sample_app
    # Built-in OWASP CRS rules are bundled in the coraza-spoa image under @owasp_crs/
    directives: |
      Include @coraza.conf-recommended
      Include @crs-setup.conf.example
      Include @owasp_crs/*.conf
      SecRuleEngine On

    response_check: false
    transaction_ttl_ms: 60000

    log_level: info
    log_file: /dev/stdout
    log_format: console
